<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="NOIR//VOID — a digital media project exploring ambition, culture and visual storytelling.">
  <title>NOIR//VOID — Enter the Void</title>
  <style>
    :root{color-scheme:dark;--bg:#080808;--fg:#f3f0e9;--muted:#aaa49b;--line:#302e2a;--accent:#c9bda8}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 50% 42%,#191714 0%,#080808 58%);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}
    main{width:min(920px,100%);padding:48px 28px;text-align:center}
    .mark{width:74px;height:74px;border:1px solid #766e60;border-radius:50%;display:grid;place-items:center;margin:0 auto 34px;color:var(--accent);font-family:Georgia,serif;font-size:25px;letter-spacing:-3px}
    .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:clamp(42px,9vw,86px);letter-spacing:.12em;font-weight:500;margin:22px 0 18px}
    h1 span{color:var(--accent)} .rule{width:54px;height:1px;background:var(--accent);margin:28px auto}
    p{max-width:550px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.9}
    .links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:38px}
    a{display:inline-block;padding:13px 22px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;transition:.2s}
    a:hover{border-color:var(--accent);color:var(--accent)}
    footer{margin-top:88px;color:#777168;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="NV monogram">N/V</div>
    <div class="eyebrow">Independent digital media</div>
    <h1>NOIR<span>//</span>VOID</h1>
    <div class="rule"></div>
    <p>A digital space for ambition, culture and visual storytelling.<br>Quiet confidence. Unfiltered perspective. No noise.</p>
    <div class="links">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="mailto:hello@noirvoid.example">Contact</a>
    </div>
    <footer>NOIR//VOID · Independent by design</footer>
  </main>
</body>
</html>
